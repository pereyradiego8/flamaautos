name: Extraer inventario público de Agencia Flama
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mercadolibre-collect.yml"
      - "web/scripts/collect_mercadolibre.py"
      - "web/imports/agenciaflama-sources.json"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar analizador de HTML
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.14.2 lxml==6.0.2
      - name: Verificar y extraer solo publicaciones del vendedor oficial
        run: python web/scripts/collect_mercadolibre.py
      - name: Guardar extracción trazable en el repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/imports/agenciaflama-extracted.json web/imports/agenciaflama-errors.json
          if ! git diff --cached --quiet; then
            git commit -m "data(import): capture verified agency vehicle details and image references"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flama-meli-inventory
          path: |
            web/imports/agenciaflama-extracted.json
            web/imports/agenciaflama-errors.json
          retention-days: 7
