name: Descubrir faltantes de Agencia Flama
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/scripts/discover_missing_agenciaflama.py"
      - "web/scripts/collect_mercadolibre.py"
      - ".github/workflows/mercadolibre-missing-discovery.yml"
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar analizador de fichas públicas
        run: pip install beautifulsoup4==4.14.2 lxml==6.0.2
      - name: Identificar faltantes y verificar vendedor por publicación
        run: python web/scripts/discover_missing_agenciaflama.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flama-new-listings-evidence
          path: |
            web/imports/agenciaflama-missing-extracted.json
            web/imports/agenciaflama-missing-discovery.json
          retention-days: 10
