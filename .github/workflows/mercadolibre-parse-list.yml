name: Mapear publicaciones verificadas de Agencia Flama
on:
  push:
    branches: [main]
    paths: [".github/workflows/mercadolibre-parse-list.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Identificar avisos y paginación
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re,html,json
          from html.parser import HTMLParser
          class Anchors(HTMLParser):
            def __init__(self):super().__init__();self.links=[];self.buf=None
            def handle_starttag(self,t,a):
              if t=='a':self.buf={'attrs':dict(a),'text':''}
            def handle_data(self,s):
              if self.buf is not None:self.buf['text']+=s
            def handle_endtag(self,t):
              if t=='a' and self.buf is not None:self.links.append(self.buf);self.buf=None
          url='https://autos.mercadolibre.com.ar/_SellerId_117436611'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36','Accept-Language':'es-AR,es;q=0.9'})
          with urllib.request.urlopen(req,timeout=30) as r:s=r.read().decode('utf-8','replace')
          p=Anchors();p.feed(s)
          relevant=[]
          for a in p.links:
            h=html.unescape(a['attrs'].get('href',''))
            if re.search(r'auto\.mercadolibre\.com\.ar/MLA-\d+',h):
              relevant.append({'href':h[:280],'text':a['text'][:140]})
          print('LISTING LINKS',len(relevant),'UNIQUE',len(set(re.search('MLA-([0-9]+)',x['href']).group(1) for x in relevant)))
          print('PRODUCTS',json.dumps(relevant[:60],ensure_ascii=False)[:18000])
          for w in ['ui-search-result__wrapper','ui-search-item__title','ui-search-price__second-line','pagination','next','_Desde_','paginator','_SellerId_117436611']:
            pos=s.find(w)
            print('FIND',w,pos,repr(s[max(0,pos-180):pos+420])[:650] if pos>=0 else '')
          pages=[]
          for a in p.links:
            h=html.unescape(a['attrs'].get('href',''))
            if any(k in h for k in ['_Desde_','_Page_','_SellerId_117436611']) and h not in pages: pages.append(h)
          print('PAGINATION',pages[:30])
          metas=re.findall(r'<script[^>]+type="application/ld\+json"[^>]*>(.*?)</script>',s,re.S)
          print('JSONLD_COUNT',len(metas),'JSONLD_SAMPLE',metas[0][:1000] if metas else '')
          PY
