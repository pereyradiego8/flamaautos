name: Diagnóstico de fuentes Mercado Libre
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mercadolibre-discovery.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar acceso sin autenticación a publicaciones del vendedor
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const targets=[
           ['store','https://www.mercadolibre.com.ar/pagina/agenciaflama'],
           ['listing','https://listado.mercadolibre.com.ar/pagina/agenciaflama/'],
           ['nickname-search','https://api.mercadolibre.com/sites/MLA/search?nickname=AGENCIAFLAMA&limit=3'],
           ['user-public','https://api.mercadolibre.com/users/AGENCIAFLAMA'],
          ];
          for (const [label,url] of targets){
            try{
              const response=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0 (compatible; FlamaAutosCatalogImporter/1.0)','Accept':'application/json,text/html'},signal:AbortSignal.timeout(12000),redirect:'follow'});
              const body=await response.text();
              let keys=[];let resultCount=null;let sellers=[];let ids=[];
              try{const data=JSON.parse(body);keys=Object.keys(data).slice(0,12);resultCount=data.paging?.total??null;sellers=[...new Set((data.results??[]).map(x=>x.seller?.id).filter(Boolean))].slice(0,5);ids=(data.results??[]).map(x=>x.id).slice(0,5)}catch{}
              const links=[...body.matchAll(/href=["']([^"']{1,550})["']/g)].map(m=>m[1].replaceAll('&amp;','&'));
              const itemLinks=links.filter(x=>/mercadolibre.*(MLA-?|\/MLA)|\/MLA-?\d+|\/p\/MLA|\/articulo/i.test(x)).slice(0,12);
              const sellerTokens=[...body.matchAll(/.{0,110}(?:seller_id|sellerId|agenciaflama|MLA\d{8,}).{0,130}/gi)].map(m=>m[0]).slice(0,20);
              const nextData=[...body.matchAll(/<script[^>]*(?:application\/ld\+json|__NEXT_DATA__)[^>]*>([\s\S]{0,200000}?)<\/script>/gi)].map(m=>m[1].slice(0,1300)).slice(0,3);
              const productLinks=links.filter(x=>/vehiculos|autos|productos|listado|agenciaflama/i.test(x)).slice(0,18);
              console.log(JSON.stringify({label,status:response.status,finalHost:new URL(response.url).hostname,contentType:response.headers.get('content-type'),length:body.length,keys,resultCount,sellers,ids,hasStoreName:/Flama Autos/i.test(body),itemLinks,productLinks,sellerTokens,nextData}));
            }catch(e){console.log(JSON.stringify({label,error:String(e).slice(0,180)}))}
          }
          JS
