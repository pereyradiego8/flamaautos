name: Actualizar dependencias auditadas (rama de pruebas)
on:
  push:
    branches: [mejoras-auditoria-20261019]
    paths: ['.github/workflows/update-audit-deps.yml', 'web/eslint.config.mjs']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mejoras-auditoria-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Actualizar Next.js a versión corregida y recalcular lockfile
        working-directory: web
        run: |
          npm install --save-exact next@16.4.2 eslint-config-next@16.4.2 --no-fund
          npm audit --omit=dev --audit-level=high
          npm test
          npm run typecheck
          npm run lint
          npm run build
      - name: Commitear solo actualización validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          git diff --cached --quiet || git commit -m "fix(security): upgrade Next.js to 16.4.2 and resolve production advisories"
          git push origin HEAD:mejoras-auditoria-20261019
